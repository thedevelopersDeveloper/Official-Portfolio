<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me - My Developer Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Fira Code', monospace;
    }

    body {
      background: #1a1a1a;
      color: #e0e0e0;
      line-height: 1.6;
    }

    nav {
      background: #252526;
      padding: 1rem;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    .nav-logo {
      font-size: 1.5rem;
      color: #569cd6;
    }

    .nav-menu {
      display: flex;
      list-style: none;
      gap: 2rem;
    }

    .nav-menu li {
      display: inline-block;
    }

    .nav-menu a {
      color: #569cd6;
      text-decoration: none;
      font-size: 1.1rem;
      transition: color 0.3s;
    }

    .nav-menu a:hover {
      color: #4ec9b0;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 5px;
    }

    .hamburger span {
      width: 25px;
      height: 3px;
      background: #569cd6;
      transition: all 0.3s ease;
    }

    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }

    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(7px, -7px);
    }

    section {
      padding: 5rem 2rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #contact {
      background: linear-gradient(135deg, #1a1a1a 50%, #252526 100%);
    }

    h1 {
      font-size: 3rem;
      color: #4ec9b0;
      margin-bottom: 1rem;
    }

    h2 {
      font-size: 2rem;
      color: #569cd6;
      margin-bottom: 2rem;
    }

    p {
      max-width: 600px;
      text-align: center;
      font-size: 1.1rem;
    }

    .contact-form {
      max-width: 600px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .contact-form input,
    .contact-form textarea {
      padding: 0.8rem;
      background: #252526;
      border: 1px solid #3c3c3c;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 1rem;
    }

    .contact-form button {
      padding: 0.8rem;
      background: #569cd6;
      border: none;
      border-radius: 4px;
      color: #1a1a1a;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    .contact-form button:hover {
      background: #4ec9b0;
    }

    footer {
      background: #252526;
      text-align: center;
      padding: 1rem;
      color: #569cd6;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }

      h2 {
        font-size: 1.5rem;
      }

      .hamburger {
        display: flex;
      }

      .nav-menu {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 60px;
        left: 0;
        width: 100%;
        background: #252526;
        padding: 1rem;
        border-top: 1px solid #3c3c3c;
      }

      .nav-menu.active {
        display: flex;
      }

      .nav-menu li {
        margin: 0.5rem 0;
      }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-container">
      <div class="nav-logo">Ashirwad Dwivedi</div>
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <ul class="nav-menu">
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/projects">Projects</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <section id="contact">
    <h1>Get in Touch</h1>
    <p>Have a project in mind or just want to say hi? Drop me a message below!</p>
    <form class="contact-form" method="POST" action="/submit">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

  <footer>
    <p>© 2025 Ashirwad Dwivedi. All rights reserved.</p>
  </footer>

  <script>
    const hamburger = document.querySelector('.hamburger');
    const navMenu = document.querySelector('.nav-menu');

    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      navMenu.classList.toggle('active');
    });

    // Close menu when a link is clicked
    document.querySelectorAll('.nav-menu a').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('active');
        navMenu.classList.remove('active');
      });
    });

    // Smooth scrolling for nav links
    document.querySelectorAll('nav a').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const href = this.getAttribute('href');
        if (href.startsWith('#')) {
          const sectionId = href.substring(1);
          document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth' });
        } else {
          window.location.href = href;
        }
      });
    });
  </script>
</body>
</html>
